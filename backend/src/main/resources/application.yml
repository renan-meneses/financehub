spring:
  application:
    name: financehub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/financehub}
    username: ${DATABASE_USER:financehub}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
financehub:
  public-url: ${PUBLIC_URL:https://localhost}
  auth:
    issuer: ${JWT_ISSUER:https://localhost}
    key-directory: ${JWT_KEY_DIRECTORY:/keys}
    key-id: ${JWT_KEY_ID:development}
    secure-cookies: ${SECURE_COOKIES:true}
  mail:
    from: ${MAIL_FROM:financehub@localhost}
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
